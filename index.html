<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Contato</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1>Suas fotos saem <span>assim</span>?</h1>
    <p class="subtitle">Preencha o formulário abaixo e entraremos em contato.</p>

    <div class="slideshow-container">
      <img src="fotos/foto1.png" alt="Foto 1" class="slide active">
      <img src="fotos/foto2.png" alt="Foto 2" class="slide">
    </div>

    <div class="divisor">Fale conosco</div>

    <form id="form" novalidate>

      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome" />
        <span class="field-error" id="nomeErro"></span>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" />
        <span class="field-error" id="emailErro"></span>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" placeholder="(11) 99999-9999" maxlength="15" />
        <span class="field-error" id="telefoneErro"></span>
      </div>

      <div class="form-group">
        <label for="assunto">Você está satisfeito com o resultado?</label>
        <select id="assunto">
          <option value="">Selecione uma opção</option>
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
        </select>
        <span class="field-error" id="assuntoErro"></span>
      </div>

      <div class="form-group">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
        <span class="field-error" id="mensagemErro"></span>
      </div>

      <button type="submit" class="btn-enviar">ENVIAR</button>

      <div id="sucesso" class="sucesso" hidden>
        ✅ Mensagem enviada com sucesso! Em breve entraremos em contato.
      </div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
